<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SXP Promo Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<style>
  :root {
    --bg: #0f1012; --panel: #17191c; --line: #2a2d32; --text: #ecedef; --muted: #8b9098;
    --accent: #f2f2f2; --accent-ink: #111; --danger: #ff6b6b; --ok: #5fd08a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Open Sans", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: .02em; }
  header span { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(280px, 1fr) 380px; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .canvas-wrap { position: relative; height: min(78vh, 900px); aspect-ratio: 9/16; max-width: 100%; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  canvas { width: 100%; height: 100%; display: block; }
  .drop { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; color: var(--muted); border: 2px dashed var(--line); border-radius: 10px; cursor: pointer; background: #0b0c0d; }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .drop strong { color: var(--text); font-size: 16px; }
  .transport { display: flex; align-items: center; gap: 10px; width: min(100%, 506px); }
  .transport input[type=range] { flex: 1; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; min-width: 88px; text-align: right; }

  aside { display: flex; flex-direction: column; gap: 14px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  section h2 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  input[type=text], input[type=number], select { width: 100%; background: #0f1113; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; }
  input[type=text]:focus, input[type=number]:focus, select:focus { outline: none; border-color: #555b63; }
  input[type=range] { width: 100%; accent-color: #d9d9d9; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; margin: 8px 0 0; }
  .inline { display: flex; gap: 6px; }
  .inline input { flex: 1; }
  button { font: inherit; font-weight: 600; border-radius: 6px; border: 1px solid var(--line); background: #22252a; color: var(--text); padding: 8px 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: #2b2f35; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); width: 100%; padding: 12px; font-size: 15px; }
  button.primary:hover:not(:disabled) { background: #fff; }
  button.small { padding: 6px 8px; font-size: 12px; white-space: nowrap; }
  .progress { height: 6px; background: #0f1113; border-radius: 3px; overflow: hidden; margin-top: 10px; display: none; }
  .progress > div { height: 100%; width: 0; background: var(--ok); transition: width .1s; }
  .status { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 1em; }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--ok); }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button { flex: 1; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>SXP Promo Maker</h1>
  <span>Output: 1080×1920 MP4 (H.264 + AAC), ready for Reels, TikTok and Stories</span>
</header>

<main>
  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="canvas" width="1080" height="1920"></canvas>
      <div class="drop" id="drop">
        <strong>Drop a video here</strong>
        <div>or click to choose a file</div>
        <div class="hint">MP4 / MOV. Any orientation; it gets cropped to 9:16.</div>
      </div>
    </div>
    <div class="transport">
      <button class="small" id="playBtn" disabled>Play</button>
      <input type="range" id="scrub" min="0" max="1" step="0.001" value="0" disabled>
      <div class="time" id="timeLbl">0:00.0 / 0:00.0</div>
    </div>
    <input type="file" id="file" accept="video/*" hidden>
  </div>

  <aside>
    <section>
      <h2>Text</h2>
      <label for="subtitle">Class</label>
      <input type="text" id="subtitle" value="Beginner Choreography">
      <label for="name">Teacher</label>
      <input type="text" id="name" value="Casper">
      <div class="row">
        <div><label for="when">Day &amp; time</label><input type="text" id="when" value="WED 6-7PM"></div>
        <div><label for="where">Location</label><input type="text" id="where" value="EM Studio"></div>
      </div>
      <label class="check"><input type="checkbox" id="caps" checked> Class &amp; teacher in capitals</label>
    </section>

    <section>
      <h2>Look</h2>
      <div class="row">
        <div>
          <label for="logoColor">Logo</label>
          <select id="logoColor">
            <option value="navy">Navy (original)</option>
            <option value="white">White</option>
            <option value="black">Black</option>
            <option value="none">Hidden</option>
          </select>
        </div>
        <div>
          <label for="anim">Text animation</label>
          <select id="anim">
            <option value="rise">Rise in</option>
            <option value="fade">Fade in</option>
            <option value="none">None</option>
          </select>
        </div>
      </div>
      <label for="shade">Bottom shade (text readability): <span id="shadeVal"></span></label>
      <input type="range" id="shade" min="0" max="0.8" step="0.01" value="0.35">
      <label for="textY">Text height: <span id="textYVal"></span></label>
      <input type="range" id="textY" min="-0.25" max="0.05" step="0.005" value="0">
      <label class="check"><input type="checkbox" id="fades" checked> Fade in from black, fade out at end</label>
      <label class="check"><input type="checkbox" id="guides"> Show Reels UI safe zones (preview only)</label>
    </section>

    <section>
      <h2>Framing &amp; trim</h2>
      <label for="zoom">Zoom: <span id="zoomVal"></span></label>
      <input type="range" id="zoom" min="1" max="2.5" step="0.01" value="1">
      <div class="row">
        <div><label for="panX">Left / right</label><input type="range" id="panX" min="-1" max="1" step="0.01" value="0"></div>
        <div><label for="panY">Up / down</label><input type="range" id="panY" min="-1" max="1" step="0.01" value="0"></div>
      </div>
      <div class="row">
        <div>
          <label for="tIn">Start (s)</label>
          <div class="inline"><input type="number" id="tIn" min="0" step="0.1" value="0"><button class="small" id="setIn" title="Use current playhead">Set</button></div>
        </div>
        <div>
          <label for="tOut">End (s)</label>
          <div class="inline"><input type="number" id="tOut" min="0" step="0.1" value="0"><button class="small" id="setOut" title="Use current playhead">Set</button></div>
        </div>
      </div>
      <div class="hint" id="durLbl"></div>
    </section>

    <section>
      <h2>Export</h2>
      <div class="row">
        <div>
          <label for="fps">Frame rate</label>
          <select id="fps"><option>30</option><option>25</option><option>60</option></select>
        </div>
        <div>
          <label for="quality">Quality</label>
          <select id="quality">
            <option value="12000000">High (12 Mbps)</option>
            <option value="20000000">Max (20 Mbps)</option>
            <option value="8000000">Smaller file (8 Mbps)</option>
          </select>
        </div>
      </div>
      <div style="margin-top:12px"><button class="primary" id="exportBtn" disabled>Export MP4</button></div>
      <div class="actions">
        <button class="small" id="stillBtn" disabled>Save current frame (PNG)</button>
        <button class="small" id="cancelBtn" disabled>Cancel export</button>
      </div>
      <div class="progress" id="progress"><div></div></div>
      <div class="status" id="status"></div>
    </section>
  </aside>
</main>

<video id="video" playsinline preload="auto" style="display:none"></video>

const W = 1080, H = 1920;
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const video = $('video');
const fields = ['subtitle','name','when','where','caps','logoColor','anim','shade','textY','fades','guides','zoom','panX','panY','fps','quality'];

let file = null, audioBuffer = null, exporting = false, cancelRequested = false;
const logos = {};  // tinted, trimmed logo canvases

// ---------- settings persistence ----------
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('sxp-promo') || '{}');
    for (const k of fields) if (k in s) { const el = $(k); el.type === 'checkbox' ? el.checked = s[k] : el.value = s[k]; }
  } catch {}
}
function saveSettings() {
  try {
    const s = {};
    for (const k of fields) { const el = $(k); s[k] = el.type === 'checkbox' ? el.checked : el.value; }
    localStorage.setItem('sxp-promo', JSON.stringify(s));
  } catch {}
}
const opt = () => ({
  subtitle: $('subtitle').value.trim(),
  name: $('name').value.trim(),
  pill: [$('when').value.trim(), $('where').value.trim()].filter(Boolean).join('  |  '),
  caps: $('caps').checked,
  logo: $('logoColor').value,
  anim: $('anim').value,
  shade: +$('shade').value,
  textY: +$('textY').value,
  fades: $('fades').checked,
  zoom: +$('zoom').value, panX: +$('panX').value, panY: +$('panY').value,
});

// ---------- logo prep: trim transparent padding and make colour variants ----------
function prepLogo() {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0);
      const d = g.getImageData(0, 0, c.width, c.height).data;
      let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
      for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
        if (d[(y * c.width + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      const tw = x1 - x0 + 1, th = y1 - y0 + 1;
      for (const [key, color] of Object.entries({ navy: null, white: '#ffffff', black: '#000000' })) {
        const t = document.createElement('canvas');
        t.width = tw; t.height = th;
        const tg = t.getContext('2d');
        tg.drawImage(img, x0, y0, tw, th, 0, 0, tw, th);
        if (color) { tg.globalCompositeOperation = 'source-in'; tg.fillStyle = color; tg.fillRect(0, 0, tw, th); }
        logos[key] = t;
      }
      res();
    };
    img.src = LOGO_SRC;
  });
}

// ---------- drawing ----------
const ease = t => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);

function fitText(g, text, font, maxW, spacing) {
  // Shrinks a font size until the text fits maxW. font is a function of size.
  let size = font.size;
  g.letterSpacing = spacing(size) + 'px';
  g.font = font.css(size);
  while (g.measureText(text).width > maxW && size > 10) {
    size -= 2; g.letterSpacing = spacing(size) + 'px'; g.font = font.css(size);
  }
  return size;
}

function textAnim(o, t, delay) {
  // Returns {alpha, dy} for an element entering at `delay` seconds.
  if (o.anim === 'none' || t == null) return { alpha: 1, dy: 0 };
  const p = ease((t - delay) / 0.7);
  return { alpha: p, dy: o.anim === 'rise' ? (1 - p) * 40 : 0 };
}

function drawFrame(g, o, t, dur, showGuides) {
  // t = seconds since clip start (null for static preview with everything visible)
  g.save();
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);

  // Video, cover-fit with zoom and pan
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw && vh) {
    const s = Math.max(W / vw, H / vh) * o.zoom;
    const dw = vw * s, dh = vh * s;
    const x = -(dw - W) / 2 * (1 + o.panX);
    const y = -(dh - H) / 2 * (1 + o.panY);
    g.imageSmoothingQuality = 'high';
    g.drawImage(video, x, y, dw, dh);
  }

  // Bottom shade for text legibility
  if (o.shade > 0) {
    const grad = g.createLinearGradient(0, H * 0.55, 0, H);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.6, `rgba(0,0,0,${o.shade * 0.6})`);
    grad.addColorStop(1, `rgba(0,0,0,${o.shade})`);
    g.fillStyle = grad;
    g.fillRect(0, H * 0.55, W, H * 0.45);
  }

  // Logo (top right)
  if (o.logo !== 'none' && logos[o.logo]) {
    const L = logos[o.logo];
    const lw = W * 0.40, lh = lw * L.height / L.width;
    const a = textAnim(o, t, 0.1);
    g.globalAlpha = a.alpha;
    g.drawImage(L, W - lw - W * 0.03, H * 0.065, lw, lh);
    g.globalAlpha = 1;
  }

  const off = o.textY * H;
  const cx = W / 2;
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';

  // Subtitle (class)
  const sub = o.caps ? o.subtitle.toUpperCase() : o.subtitle;
  if (sub) {
    const a = textAnim(o, t, 0.25);
    g.globalAlpha = a.alpha;
    fitText(g, sub, { size: 56, css: s => `600 ${s}px "Open Sans"` }, W * 0.86, s => s * 0.02);
    g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 18; g.shadowOffsetY = 2;
    g.fillStyle = '#fff';
    g.fillText(sub, cx, H * 0.783 + off + a.dy);
  }

  // Teacher name
  const nm = o.caps ? o.name.toUpperCase() : o.name;
  if (nm) {
    const a = textAnim(o, t, 0.4);
    g.globalAlpha = a.alpha;
    fitText(g, nm, { size: 205, css: s => `800 ${s}px "Open Sans"` }, W * 0.9, s => s * 0.01);
    g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 28; g.shadowOffsetY = 3;
    g.fillStyle = '#fff';
    g.fillText(nm, cx, H * 0.882 + off + a.dy);
  }
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;

  // Schedule pill
  if (o.pill) {
    const a = textAnim(o, t, 0.55);
    g.globalAlpha = a.alpha;
    const size = fitText(g, o.pill, { size: 44, css: s => `700 ${s}px "Open Sans"` }, W * 0.8, () => 0);
    const tw = g.measureText(o.pill).width;
    const ph = size * 1.7, pw = tw + size * 1.1;
    const py = H * 0.913 + off + a.dy - ph / 2;
    g.fillStyle = 'rgba(255,255,255,0.8)';
    g.beginPath(); g.roundRect(cx - pw / 2, py, pw, ph, 8); g.fill();
    g.fillStyle = '#141414';
    g.textBaseline = 'middle';
    g.fillText(o.pill, cx, py + ph / 2 + size * 0.04);
    g.textBaseline = 'alphabetic';
  }
  g.globalAlpha = 1;
  g.letterSpacing = '0px';

  // Fade from / to black
  if (o.fades && t != null && dur) {
    const fin = 1 - Math.min(t / 0.4, 1);
    const fout = 1 - Math.min((dur - t) / 0.5, 1);
    const k = Math.max(fin, fout, 0);
    if (k > 0) { g.fillStyle = `rgba(0,0,0,${k})`; g.fillRect(0, 0, W, H); }
  }

  // Safe-zone guides (never exported)
  if (showGuides) {
    g.fillStyle = 'rgba(255,60,60,0.18)';
    g.fillRect(0, 0, W, 220);
    g.fillRect(0, H - 380, W, 380);
    g.fillRect(W - 150, 220, 150, H - 600);
    g.fillStyle = 'rgba(255,255,255,0.8)';
    g.font = '600 26px "Open Sans"'; g.textAlign = 'left';
    g.fillText('Reels UI may cover shaded areas', 24, 200);
  }
  g.restore();
}

// ---------- preview ----------
function trimRange() {
  const d = video.duration || 0;
  let a = Math.max(0, +$('tIn').value || 0), b = +$('tOut').value || d;
  b = Math.min(b, d); if (b <= a) b = d;
  return [a, b];
}
function render() {
  const [a, b] = trimRange();
  const playing = !video.paused;
  const t = playing ? video.currentTime - a : null;
  drawFrame(ctx, opt(), t, b - a, $('guides').checked);
}
function loop() {
  if (exporting) return;
  if (!video.paused) {
    const [a, b] = trimRange();
    if (video.currentTime >= b || video.currentTime < a - 0.05) video.currentTime = a;
    updateTime();
  }
  render();
  requestAnimationFrame(loop);
}
const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
function updateTime() {
  $('timeLbl').textContent = `${fmt(video.currentTime || 0)} / ${fmt(video.duration || 0)}`;
  if (video.duration) $('scrub').value = video.currentTime / video.duration;
}
function updateLabels() {
  $('shadeVal').textContent = Math.round($('shade').value * 100) + '%';
  $('zoomVal').textContent = (+$('zoom').value).toFixed(2) + '×';
  const ty = +$('textY').value;
  $('textYVal').textContent = ty === 0 ? 'default' : (ty < 0 ? 'raised ' : 'lowered ') + Math.abs(Math.round(ty * H)) + 'px';
  if (video.duration) {
    const [a, b] = trimRange();
    $('durLbl').textContent = `Clip length: ${(b - a).toFixed(1)}s (source ${video.duration.toFixed(1)}s)`;
  }
}

// ---------- loading ----------
async function loadFile(f) {
  if (!f || !f.type.startsWith('video/') && !/\.(mov|mp4|m4v|webm)$/i.test(f.name)) { setStatus('That file is not a video.', 'err'); return; }
  file = f; audioBuffer = null;
  video.src = URL.createObjectURL(f);
  video.muted = false;
  setStatus('Loading video…');
  await new Promise((res, rej) => { video.onloadeddata = res; video.onerror = () => rej(new Error('This browser cannot play that video format.')); })
    .catch(e => { setStatus(e.message, 'err'); throw e; });
  $('drop').style.display = 'none';
  $('tIn').value = 0;
  $('tOut').value = video.duration.toFixed(1);
  for (const id of ['playBtn', 'scrub', 'exportBtn', 'stillBtn']) $(id).disabled = false;
  updateLabels(); updateTime();
  setStatus(`${f.name} · ${video.videoWidth}×${video.videoHeight} · ${video.duration.toFixed(1)}s`);
  // Decode the audio track in the background for export
  f.arrayBuffer().then(buf => new AudioContext().decodeAudioData(buf))
    .then(ab => { audioBuffer = ab; })
    .catch(() => { audioBuffer = null; });
}

// ---------- export ----------
function setStatus(msg, cls = '') { const s = $('status'); s.textContent = msg; s.className = 'status ' + cls; }
function setProgress(p) { $('progress').style.display = p == null ? 'none' : 'block'; $('progress').firstElementChild.style.width = ((p || 0) * 100) + '%'; }

function seek(t) {
  return new Promise(res => {
    const done = () => { video.removeEventListener('seeked', done); res(); };
    video.addEventListener('seeked', done);
    video.currentTime = t;
  });
}

async function pickVideoCodec(bitrate, fps) {
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42003e', 'avc1.640033']) {
    const cfg = { codec, width: W, height: H, bitrate, framerate: fps, bitrateMode: 'variable', latencyMode: 'quality', avc: { format: 'avc' } };
    try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg; } catch {}
  }
  return null;
}
async function pickAudioCodec() {
  if (typeof AudioEncoder === 'undefined') return null;
  const cfg = { codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 };
  try { if ((await AudioEncoder.isConfigSupported(cfg)).supported) return cfg; } catch {}
  return null;
}

async function renderAudio(a, b, fades) {
  // Trim + resample to 48 kHz stereo, with short fades so the cut never clicks
  const len = Math.ceil((b - a) * 48000);
  const oc = new OfflineAudioContext(2, len, 48000);
  const src = oc.createBufferSource();
  src.buffer = audioBuffer;
  const gain = oc.createGain();
  const fi = fades ? 0.4 : 0.02, fo = fades ? 0.5 : 0.02, d = b - a;
  gain.gain.setValueAtTime(0, 0);
  gain.gain.linearRampToValueAtTime(1, fi);
  gain.gain.setValueAtTime(1, Math.max(fi, d - fo));
  gain.gain.linearRampToValueAtTime(0, d);
  src.connect(gain).connect(oc.destination);
  src.start(0, a, d);
  return oc.startRendering();
}

async function exportVideo() {
  if (typeof VideoEncoder === 'undefined') { setStatus('This browser cannot export MP4. Please open this file in Google Chrome.', 'err'); return; }
  const fps = +$('fps').value, bitrate = +$('quality').value;
  const vcfg = await pickVideoCodec(bitrate, fps);
  if (!vcfg) { setStatus('H.264 encoding is not available in this browser. Please use Google Chrome.', 'err'); return; }

  if (!audioBuffer) setStatus('Preparing audio…');
  // give background audio decode a moment if it is still running
  for (let i = 0; i < 40 && !audioBuffer && file; i++) await new Promise(r => setTimeout(r, 100));
  const acfg = audioBuffer ? await pickAudioCodec() : null;

  exporting = true; cancelRequested = false;
  video.pause();
  const resumeAt = video.currentTime;
  for (const id of ['exportBtn', 'stillBtn', 'playBtn', 'scrub']) $(id).disabled = true;
  $('cancelBtn').disabled = false;
  const o = opt();
  const [a, b] = trimRange();
  const dur = b - a;
  const total = Math.max(1, Math.round(dur * fps));

  let failure = null;
  const muxer = new Mp4Muxer.Muxer({
    target: new Mp4Muxer.ArrayBufferTarget(),
    video: { codec: 'avc', width: W, height: H, frameRate: fps },
    audio: acfg ? { codec: 'aac', numberOfChannels: 2, sampleRate: 48000 } : undefined,
    fastStart: 'in-memory',
    firstTimestampBehavior: 'offset',
  });
  const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => failure = e });
  venc.configure(vcfg);

  try {
    // Audio first (fast, offline)
    if (acfg) {
      setStatus('Encoding audio…');
      const rendered = await renderAudio(a, b, o.fades);
      const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => failure = e });
      aenc.configure(acfg);
      const L = rendered.getChannelData(0), R = rendered.getChannelData(1);
      const block = 1024;
      for (let i = 0; i < rendered.length; i += block) {
        const n = Math.min(block, rendered.length - i);
        const data = new Float32Array(n * 2);
        data.set(L.subarray(i, i + n), 0);
        data.set(R.subarray(i, i + n), n);
        const ad = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i / 48000 * 1e6), data });
        aenc.encode(ad); ad.close();
      }
      await aenc.flush(); aenc.close();
    }

    // Video: seek to every output frame so nothing is ever dropped
    for (let i = 0; i < total; i++) {
      if (cancelRequested) throw new Error('cancelled');
      if (failure) throw failure;
      const t = i / fps;
      await seek(Math.min(a + t + 0.5 / fps, b - 0.001));
      drawFrame(ctx, o, t, dur, false);
      const frame = new VideoFrame(canvas, { timestamp: Math.round(t * 1e6), duration: Math.round(1e6 / fps) });
      venc.encode(frame, { keyFrame: i % (fps * 2) === 0 });
      frame.close();
      while (venc.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 5));
      if (i % 3 === 0) { setProgress(i / total); setStatus(`Rendering frame ${i + 1} of ${total}…`); }
    }
    await venc.flush();
    if (failure) throw failure;
    muxer.finalize();

    const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    const safe = s => s.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_');
    const name = `SXP_${safe(o.name) || 'Promo'}_${safe(o.subtitle) || 'Class'}.mp4`;
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = name; link.click();
    setProgress(1);
    setStatus(`Done: ${name} (${(blob.size / 1e6).toFixed(1)} MB${acfg ? '' : ', no audio'}). Check your Downloads folder.`, 'ok');
  } catch (e) {
    setProgress(null);
    if (e.message === 'cancelled') setStatus('Export cancelled.');
    else { console.error(e); setStatus('Export failed: ' + (e.message || e), 'err'); }
    try { venc.close(); } catch {}
  } finally {
    exporting = false;
    for (const id of ['exportBtn', 'stillBtn', 'playBtn', 'scrub']) $(id).disabled = false;
    $('cancelBtn').disabled = true;
    await seek(resumeAt);
    requestAnimationFrame(loop);
  }
}

function saveStill() {
  drawFrame(ctx, opt(), null, 0, false);
  canvas.toBlob(b => {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(b);
    link.download = `SXP_${$('name').value.trim() || 'Promo'}_cover.png`;
    link.click();
  }, 'image/png');
}

// ---------- wiring ----------
const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => loadFile(e.target.files[0]);
for (const el of [drop, document.querySelector('.canvas-wrap')]) {
  el.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  el.addEventListener('dragleave', () => drop.classList.remove('over'));
  el.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (!exporting) loadFile(e.dataTransfer.files[0]); });
}
canvas.ondblclick = () => { if (!exporting) $('file').click(); };
$('playBtn').onclick = () => {
  if (video.paused) { const [a, b] = trimRange(); if (video.currentTime < a || video.currentTime >= b - 0.05) video.currentTime = a; video.play(); }
  else video.pause();
};
video.onplay = () => $('playBtn').textContent = 'Pause';
video.onpause = () => $('playBtn').textContent = 'Play';
$('scrub').oninput = e => { if (video.duration) { video.currentTime = e.target.value * video.duration; updateTime(); } };
video.onseeked = updateTime;
$('setIn').onclick = () => { $('tIn').value = video.currentTime.toFixed(1); updateLabels(); };
$('setOut').onclick = () => { $('tOut').value = video.currentTime.toFixed(1); updateLabels(); };
$('tIn').oninput = $('tOut').oninput = updateLabels;
$('exportBtn').onclick = exportVideo;
$('cancelBtn').onclick = () => { cancelRequested = true; };
$('stillBtn').onclick = saveStill;
for (const k of fields) $(k).addEventListener('input', () => { updateLabels(); saveSettings(); });
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT' && !$('playBtn').disabled) { e.preventDefault(); $('playBtn').click(); } });

(async () => {
  loadSettings(); updateLabels();
  await Promise.all([prepLogo(), document.fonts.load('600 56px "Open Sans"'), document.fonts.load('800 200px "Open Sans"'), document.fonts.load('700 44px "Open Sans"')]).catch(() => {});
  if (typeof Mp4Muxer === 'undefined') setStatus('Could not load the MP4 library. Check your internet connection and reload.', 'err');
  loop();
})();
</script>
</body>
</html>
